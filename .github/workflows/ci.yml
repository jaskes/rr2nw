name: CI

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc-x86:
    name: Windows MSVC x86
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test reference tooling
        run: python -m unittest discover -s tools/reference/tests -v

      - name: Configure Win32
        run: cmake --preset windows-msvc-x86

      - name: Build and test Debug
        run: |
          cmake --build --preset windows-msvc-x86-debug --parallel
          ctest --preset windows-msvc-x86-debug

      - name: Build and test Release
        run: |
          cmake --build --preset windows-msvc-x86-release --parallel
          ctest --preset windows-msvc-x86-release
